name: Add race from inbox

on:
  push:
    paths:
      - 'inbox/race.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: add-race
  cancel-in-progress: false

jobs:
  add-race:
    # the bot's own commit resets race.txt; don't react to that
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read inbox/race.txt and update the data
        run: python3 tools/inbox.py

      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data inbox
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Add race from inbox"
            git push
          fi
